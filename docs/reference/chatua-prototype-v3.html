<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatua – Prototype v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf6ee; --paper:#fffdf9; --sand:#f3e9db; --line:#eadfce;
  --clay:#c8501a; --clay-d:#a63f10; --clay-soft:#fbe6d8;
  --ink:#2a1a10; --muted:#7a6a5c; --leaf:#2f8f4e;
  --r:16px;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:#e9dcc9;color-scheme:light}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
svg{display:block}
#shell{max-width:460px;height:100%;margin:0 auto;background:var(--cream);position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0px)}
#view.pad{padding-bottom:12px}

/* top bars */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--cream);position:sticky;top:0;z-index:5}
.logo{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.logo b{font-family:var(--head);font-weight:800;font-size:25px;letter-spacing:.5px;color:var(--ink)}
.logo small{font-size:8.5px;color:var(--clay);font-weight:700;margin-top:2px}
.logo .sprig{height:14px;margin-left:16px;margin-bottom:-2px}
.icons{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative}
.ib:active{background:var(--sand)}
.badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--clay);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.backbar{display:flex;align-items:center;gap:8px;padding:12px 14px;position:sticky;top:0;background:var(--cream);z-index:5}
.backbar h2{font-family:var(--head);font-size:19px;font-weight:700}
.backbar .ib{margin-left:-4px}

/* hero */
.hero{position:relative;height:300px;overflow:hidden}
.hero .art{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(251,246,238,.96) 0%,rgba(251,246,238,.88) 38%,rgba(251,246,238,0) 78%)}
.hero .txt{position:relative;z-index:2;padding:26px 18px;max-width:75%}
.hero h1{font-family:var(--head);font-weight:800;font-size:35px;line-height:1.02;letter-spacing:-.5px}
.hero p{font-size:13px;color:var(--muted);margin:12px 0 18px;line-height:1.45;max-width:200px}
.btn{background:var(--clay);color:#fff;font-weight:700;padding:13px 20px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;transition:transform .12s,background .12s}
.btn:active{transform:scale(.97);background:var(--clay-d)}
.btn.block{width:100%;padding:16px;font-size:16px;border-radius:14px}
.btn.line{background:transparent;color:var(--clay);border:1.5px solid var(--clay)}
.btn.sm{padding:11px 18px;font-size:13.5px}

.sheet{background:var(--paper);border-radius:22px 22px 0 0;margin-top:-22px;position:relative;z-index:3;padding:18px 16px 4px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;padding:2px 0 14px}
.trust div{font-size:11px;color:var(--muted);font-weight:500;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:6px}
.trust .c{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--clay);display:grid;place-items:center;color:var(--clay)}
.trust.three{grid-template-columns:repeat(3,1fr)}

.heritage-card{position:relative;border-radius:var(--r);overflow:hidden;height:118px;margin:4px 0 20px;text-align:left;width:100%;display:block}
.heritage-card svg.bg{position:absolute;inset:0;width:100%;height:100%}
.heritage-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,250,240,.95) 5%,rgba(255,250,240,.6) 50%,rgba(255,250,240,0) 80%)}
.heritage-card .t{position:absolute;z-index:2;left:14px;top:14px;max-width:60%}
.heritage-card h3{font-family:var(--head);font-size:18px;font-weight:700}
.heritage-card p{font-size:12px;color:var(--muted);margin:3px 0 8px;line-height:1.35}
.link{color:var(--clay);font-weight:700;font-size:13px}

.sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.sec-h h3{font-family:var(--head);font-size:19px;font-weight:700}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:16px}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:block;width:100%}
.pc .im{height:112px;position:relative}
.pc .im svg{width:100%;height:100%}
.pc .b{padding:10px 12px 12px;position:relative}
.pc h4{font-size:14px;font-weight:700;line-height:1.2;padding-right:4px}
.pc small{color:var(--muted);font-size:12px}
.pc .pr{font-family:var(--head);font-size:19px;font-weight:700;margin-top:10px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;position:absolute;right:10px;bottom:10px;transition:transform .12s}
.plus:active{transform:scale(.88)}

/* shop */
.search{margin:2px 16px 12px;display:flex;align-items:center;gap:10px;background:var(--sand);border-radius:12px;padding:0 14px;height:44px;color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:0;font-size:14px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 18px;border-radius:20px;background:var(--sand);font-size:13px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--clay);color:#fff;font-weight:700}
.list{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;text-align:left;width:100%}
.row .im{width:108px;flex:none;align-self:stretch;min-height:128px}
.row .im svg{width:100%;height:100%}
.row .b{flex:1;padding:11px 12px;display:flex;flex-direction:column;min-width:0}
.row h4{font-size:15px;font-weight:700}
.row p{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.sizes{display:flex;gap:6px;margin-top:8px}
.sz{padding:5px 11px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--paper)}
.sz.on{border-color:var(--clay);color:var(--clay);font-weight:700;background:var(--clay-soft)}
.row .pr{font-family:var(--head);font-size:19px;font-weight:700;margin-top:auto;padding-top:8px}
.empty{padding:50px 24px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--head);color:var(--ink);font-size:20px;margin:14px 0 6px}
.empty .btn{margin-top:18px}

/* product */
.pgal{position:relative;height:300px}
.pgal .snap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.pgal .snap::-webkit-scrollbar{display:none}
.pgal .snap>div{flex:0 0 100%;scroll-snap-align:center;height:100%}
.pgal svg{width:100%;height:100%}
.float{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;background:rgba(40,25,15,.55);color:#fff;display:grid;place-items:center;z-index:4;backdrop-filter:blur(6px)}
.tag{position:absolute;left:14px;bottom:30px;background:var(--leaf);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;z-index:4}
.dots{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:4}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:.2s}
.dots i.on{background:var(--clay);width:16px}
.pbody{padding:20px 18px 24px}
.pbody h1{font-family:var(--head);font-size:27px;font-weight:800;letter-spacing:-.3px}
.pbody .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--paper)}
.opt b{display:block;font-size:15px}.opt span{font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--clay);background:var(--clay-soft)}.opt.on b,.opt.on span{color:var(--clay)}
.qty{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:16px}
.qb{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--paper)}
.qty b{font-size:20px;min-width:20px;text-align:center}
details{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
summary{font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;cursor:pointer}
summary::-webkit-details-marker{display:none}
details p{color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:10px}
details[open] summary svg{transform:rotate(180deg)}

/* cart & checkout */
.ci{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin:0 16px 10px;position:relative}
.ci .im{width:78px;height:78px;border-radius:12px;overflow:hidden;flex:none}
.ci .im svg{width:100%;height:100%}
.ci .b{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.ci h4{font-size:15px}.ci small{color:var(--muted);font-size:12.5px}
.ci .l{display:flex;justify-content:space-between;align-items:center}
.ci .pr{font-family:var(--head);font-size:19px;font-weight:700}
.mini{display:flex;align-items:center;gap:10px}
.mini button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--clay-soft);background:var(--clay-soft);color:var(--clay);display:grid;place-items:center}
.trash{position:absolute;right:10px;top:10px;color:var(--muted)}
.h3{font-family:var(--head);font-size:18px;font-weight:700;margin:20px 16px 12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin:0 16px;padding:14px}
.sum div{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--muted)}
.sum div span:last-child{color:var(--ink);font-weight:500}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;color:var(--ink)}
.sum .tot span{font-family:var(--head);font-size:19px;font-weight:700}
.stick{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--cream);border-top:1px solid var(--line)}
.scroll-cards{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.scroll-cards .pc{flex:0 0 46%}

.seg{display:flex;gap:10px;margin:0 16px 12px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-weight:500;color:var(--muted);font-size:14px}
.seg button.on{background:var(--clay);color:#fff;font-weight:700;border-color:var(--clay)}
.fld{display:flex;flex-direction:column;gap:10px}
.fld input{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;width:100%}
.fld input.bad{border-color:#c0392b}
.fld .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#b3321f;font-size:12.5px;margin:8px 16px 0}
.rad{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.rad.on{border-color:var(--clay);background:#fff8f2}
.rad .t{flex:1;font-size:14px}.rad .t b{display:block;font-size:14.5px}.rad .t small{color:var(--muted);font-size:12.5px}
.rad .t em{font-style:normal;color:var(--leaf);font-weight:700}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #cdbfae;display:grid;place-items:center;flex:none}
.rad.on .dot{border-color:var(--clay)}.rad.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--clay)}
.pay-wrap{margin:0 16px}

/* success */
.success{text-align:center;padding:18px 16px 24px;position:relative;overflow:hidden}
.tick{width:76px;height:76px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;margin:26px auto 14px;box-shadow:0 0 0 10px #e3f2e7;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.success h1{font-family:var(--head);font-size:30px;font-weight:800;line-height:1.05}
.success p{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.4}
.conf i{position:absolute;width:7px;height:7px;border-radius:2px;animation:fall 2.6s ease-out both}
@keyframes fall{from{transform:translateY(-30px) rotate(0);opacity:0}15%{opacity:1}to{transform:translateY(190px) rotate(300deg);opacity:0}}
.oid{text-align:left;margin:20px 0 14px}
.oid .r{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.oid small{color:var(--muted);font-size:12.5px;display:block}.oid b{font-size:15px}
.tl{margin:0 16px 14px;text-align:left}
.tl .s{display:flex;gap:12px;font-size:13.5px;padding-bottom:14px;position:relative}
.tl .s::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl .s:last-child::before{display:none}
.tl .p{width:16px;height:16px;border-radius:50%;background:var(--line);flex:none;margin-top:1px}
.tl .s.d .p{background:var(--leaf)}.tl .s span{color:var(--muted)}

/* content pages */
.photo{margin:0 16px;border-radius:var(--r);overflow:hidden;height:150px}
.photo svg{width:100%;height:100%}
.copy{padding:16px 18px 24px}
.copy h2{font-family:var(--head);font-size:24px;font-weight:800;line-height:1.1;margin-bottom:12px}
.copy p{font-size:14.5px;line-height:1.6;color:#4a3a2e;margin-bottom:12px;max-width:62ch}
.rrow{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;width:100%}
.rrow .im{width:82px;height:72px;border-radius:12px;overflow:hidden;flex:none}
.rrow .im svg{width:100%;height:100%}
.rrow b{font-size:15px}.rrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.3}
.menu{margin:8px 16px;display:flex;flex-direction:column;gap:10px}
.menu button{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px;font-weight:500;text-align:left;font-size:14.5px}
.menu svg:last-child{margin-left:auto;color:var(--muted)}

/* bottom nav */
nav{display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));flex:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px 0;position:relative;font-weight:500}
nav button.on{color:var(--clay);font-weight:700}
nav button.on::before{content:"";position:absolute;top:-7px;width:20px;height:3px;border-radius:2px;background:var(--clay)}
nav .badge{top:0;right:calc(50% - 22px)}

#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (min-width:480px){#shell{margin:16px auto;height:calc(100% - 32px);max-height:900px;border-radius:24px}}

/* ===== premium pass ===== */
:root{
  --head:'Fraunces','Iowan Old Style',Georgia,serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cream:#f7f0e4;--paper:#fffaf1;--sand:#efe4d1;--line:#e7dbc6;
  --clay:#b4421a;--clay-d:#8e3210;--clay-soft:#f6e1d2;
  --ink:#2a1a10;--muted:#85715f;--leaf:#2c7a47;
  --gold:#c8a05a;--gold-l:#e6cc94;--esp:#22130a;
  --sh:0 1px 2px rgba(60,35,15,.05),0 10px 26px -10px rgba(60,35,15,.2);
  --sh2:0 2px 4px rgba(60,35,15,.06),0 22px 44px -14px rgba(60,35,15,.32);
}
body{background:#d8c6aa;font-feature-settings:"kern","liga"}
#shell{background-color:var(--cream);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");box-shadow:0 30px 70px -20px rgba(34,19,10,.55),0 0 0 1px rgba(200,160,90,.35)}
#view{position:relative}
h1,h2,h3{font-optical-sizing:auto}

/* top bar + logo */
.topbar{background:rgba(247,240,228,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(200,160,90,.28);padding:12px 20px}
.topbar.over{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;background:transparent;border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fbf3e4}
.topbar.over .logo b{color:#fbf3e4}.topbar.over .logo small{color:var(--gold-l)}
.logo b{font-weight:600;letter-spacing:3.5px;font-size:22px}
.logo small{color:var(--clay);font-weight:600;letter-spacing:.7px;font-size:8.5px;margin-top:3px}
.backbar{border-bottom:1px solid rgba(200,160,90,.28);background:rgba(247,240,228,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.backbar h2{font-weight:600;font-size:21px;letter-spacing:-.2px}

/* hero */
.hero{height:400px;background:var(--esp)}
.hero .art{left:auto;right:0;width:84%}
.hero .art svg{width:100%;height:100%;filter:saturate(1.08) contrast(1.06)}
.hero::after{background:linear-gradient(90deg,rgba(34,19,10,.97) 0%,rgba(34,19,10,.82) 40%,rgba(34,19,10,.08) 88%),linear-gradient(180deg,rgba(34,19,10,.65) 0,transparent 28%,transparent 62%,rgba(34,19,10,.55) 100%)}
.hero .txt{padding:112px 22px 28px;max-width:80%}
.hero h1{font-weight:600;font-size:40px;line-height:1.02;letter-spacing:-1px;color:#fbf3e4}
.hero p{color:rgba(251,243,228,.74);font-size:14px;line-height:1.5;max-width:230px;margin:14px 0 22px}
.hero .btn{background:linear-gradient(180deg,#e6cc94,#c8a05a);color:var(--esp);box-shadow:0 12px 26px -8px rgba(200,160,90,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.sheet{border-radius:30px 30px 0 0;margin-top:-30px;padding:24px 18px 6px;background:var(--paper);box-shadow:0 -14px 30px -14px rgba(34,19,10,.45)}

/* buttons */
.btn{background:linear-gradient(180deg,#c64f22,#a43914);box-shadow:0 12px 24px -10px rgba(164,57,20,.75),inset 0 1px 0 rgba(255,255,255,.22);border-radius:14px;font-weight:600;letter-spacing:.2px}
.btn:active{background:linear-gradient(180deg,#a43914,#8e3210)}
.btn.line{background:transparent;box-shadow:none;border:1px solid var(--gold);color:var(--clay-d)}
.btn.block{border-radius:16px;padding:17px;font-size:15.5px}
.plus{background:linear-gradient(180deg,#c64f22,#a43914);box-shadow:0 8px 16px -6px rgba(164,57,20,.7),inset 0 1px 0 rgba(255,255,255,.25)}

/* trust icons */
.trust .c{width:42px;height:42px;border:1px solid var(--gold);background:#fff7e8;color:var(--clay)}
.trust div{font-weight:500;letter-spacing:.1px}

/* section heads */
.sec-h h3,.h3{font-weight:600;font-size:21px;letter-spacing:-.3px}
.link{color:var(--clay);font-weight:600}

/* heritage card */
.heritage-card{height:136px;border-radius:22px;box-shadow:var(--sh2);margin-bottom:26px}
.heritage-card::after{background:linear-gradient(90deg,rgba(34,19,10,.94) 8%,rgba(34,19,10,.62) 50%,rgba(34,19,10,0) 88%)}
.heritage-card .t{left:18px;top:20px}
.heritage-card h3{color:#fbf3e4;font-weight:600;font-size:20px}
.heritage-card p{color:rgba(251,243,228,.75)}
.heritage-card .link{color:var(--gold-l)}

/* cards */
.pc,.row,.ci,.card,.rrow{border:0;border-radius:20px;background:#fffdf8;box-shadow:var(--sh)}
.pc .im{height:130px}
.pc .b{padding:12px 14px 14px}
.pc h4{font-family:var(--head);font-weight:600;font-size:15.5px;letter-spacing:-.1px}
.pc small{letter-spacing:.2px}
.pc .pr,.row .pr,.ci .pr{font-weight:600;font-size:20px}
.row .im{width:118px}
.row h4{font-family:var(--head);font-weight:600;font-size:17px;letter-spacing:-.2px}
.ci h4{font-family:var(--head);font-weight:600;font-size:16px}
.mini button{background:#fbeee3;border:1px solid rgba(200,160,90,.5)}
.grid2{gap:14px}

/* search / chips / options */
.search{background:#fffdf8;box-shadow:var(--sh);border-radius:15px;height:48px;margin-top:14px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--esp);color:var(--gold-l);border-color:var(--esp);font-weight:600}
.sz{border-radius:9px}.sz.on{border-color:var(--gold);background:#fbf0dc;color:var(--clay-d)}
.opt{border-radius:15px;border-color:var(--line);background:#fffdf8}
.opt b{font-family:var(--head);font-weight:600;font-size:17px}
.opt.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#fffaf0}
.opt.on b,.opt.on span{color:var(--clay-d)}
.seg button{border-radius:14px;background:#fffdf8;border:1px solid var(--line)}
.seg button.on{background:var(--esp);border-color:var(--esp);color:var(--gold-l)}
.rad{border-radius:16px;background:#fffdf8;border:1px solid var(--line)}
.rad.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#fffaf0}
.fld input{border-radius:12px;background:#fbf5ea}

/* product page */
.pgal{height:340px}
.pgal::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(34,19,10,.45) 0,transparent 24%)}
.pbody h1{font-weight:600;font-size:31px;letter-spacing:-.8px}
.tag{background:linear-gradient(180deg,#e6cc94,#c8a05a);color:var(--esp);border-radius:7px;font-weight:700;letter-spacing:.2px}
.dots i.on{background:var(--gold)}
.qb{border-color:rgba(200,160,90,.6)}
details{border-top:1px solid rgba(200,160,90,.35)}
summary{font-family:var(--head);font-weight:600;font-size:17px}

/* bottom bars */
nav{background:rgba(255,250,241,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(200,160,90,.35)}
nav button.on::before{background:var(--gold);height:2px;width:24px}
.stick{background:rgba(255,250,241,.96);border-top:1px solid rgba(200,160,90,.35)}

/* success + toast */
.tick{background:linear-gradient(180deg,#38975a,#256b3d);box-shadow:0 0 0 9px #e8f1e6,0 0 0 10px var(--gold)}
.success h1{font-weight:600;font-size:32px;letter-spacing:-.8px}
#toast{background:var(--esp);color:#fbf3e4;border:1px solid rgba(200,160,90,.55);box-shadow:var(--sh2)}
.copy h2{font-weight:600;letter-spacing:-.5px}
.photo{box-shadow:var(--sh2);border-radius:20px}
.chips{padding-top:2px}
</style>
</head>

/* ---------- icons ---------- */

const I = {
 search:ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),

};

/* ---------- illustrations (inline SVG, no external images) ---------- */
let gid=0;
function rng(seed){let s=seed;return()=> (s=(s*16807)%2147483647)/2147483647;}
function mound(tone,extra,seed,w=300,h=260){
  const g='g'+(gid++), r=rng(seed*97+13);
  let bokeh='',grains='',specks='',ex='';
  for(let i=0;i<9;i++) bokeh+=`<circle cx="${r()*w}" cy="${r()*h*.55}" r="${14+r()*26}" fill="#e9c58a" opacity="${.08+r()*.14}"/>`;
  for(let i=0;i<70;i++){const x=r()*w,y=h*.62+r()*h*.34;grains+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3.2" ry="1.7" transform="rotate(${(r()*180)|0} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${['#b98a4e','#d9ad6b','#8c6a3a','#e7c88e'][(r()*4)|0]}" opacity=".85"/>`;}
  for(let i=0;i<46;i++){const a=r()*Math.PI,rad=r()*70;const x=w/2+Math.cos(a)*rad*1.25-0,y=h*.46-Math.sin(a)*rad*.55+r()*8;specks+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.7+r()*1.2).toFixed(1)}" fill="#fff" opacity="${(.08+r()*.18).toFixed(2)}"/>`;}
  if(extra==='seeds'){for(let i=0;i<34;i++){const x=w/2-62+r()*124,y=h*.4+r()*34;ex+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="2.6" ry="1.5" fill="${['#5a3a1c','#7a4f25','#3e2a15'][(r()*3)|0]}" transform="rotate(${(r()*180)|0} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;}}
  if(extra==='green'){for(let i=0;i<26;i++){const x=w/2-58+r()*116,y=h*.4+r()*32;ex+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="#7c9a4b"/>`;}}
  if(extra==='jaggery'){ex=`<g transform="translate(${w*.08} ${h*.66})"><rect x="0" y="0" width="38" height="30" rx="4" fill="#8a4b18" transform="rotate(-8 19 15)"/><rect x="34" y="10" width="34" height="28" rx="4" fill="#a45c1f" transform="rotate(6 51 24)"/><rect x="12" y="26" width="30" height="24" rx="4" fill="#74400f" opacity=".9"/><path d="M6 6l22-2" stroke="#d99a55" stroke-width="2" opacity=".5"/></g>`;}
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="${g}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5632"/><stop offset=".6" stop-color="#4a301a"/><stop offset="1" stop-color="#2d1c0e"/></linearGradient>
  <radialGradient id="${g}m" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="${tone}" stop-opacity="0"/></radialGradient>
  <linearGradient id="${g}w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b3f1d"/><stop offset=".5" stop-color="#9b6633"/><stop offset="1" stop-color="#5a3315"/></linearGradient></defs>
  <rect width="${w}" height="${h}" fill="url(#${g}b)"/>${bokeh}
  ${grains}${ex&&extra==='jaggery'?ex:''}
  <ellipse cx="${w/2}" cy="${h*.84}" rx="${w*.4}" ry="${h*.07}" fill="#000" opacity=".25"/>
  <path d="M${w*.12} ${h*.58} Q${w*.14} ${h*.86} ${w*.5} ${h*.88} Q${w*.86} ${h*.86} ${w*.88} ${h*.58} Z" fill="url(#${g}w)"/>
  <path d="M${w*.2} ${h*.66} Q${w*.5} ${h*.74} ${w*.8} ${h*.66}" stroke="#c48b4f" stroke-width="2" fill="none" opacity=".5"/>
  <path d="M${w*.2} ${h*.58} C${w*.26} ${h*.28} ${w*.4} ${h*.2} ${w*.5} ${h*.2} C${w*.6} ${h*.2} ${w*.74} ${h*.28} ${w*.8} ${h*.58} Z" fill="${tone}"/>
  <path d="M${w*.2} ${h*.58} C${w*.26} ${h*.28} ${w*.4} ${h*.2} ${w*.5} ${h*.2} C${w*.6} ${h*.2} ${w*.74} ${h*.28} ${w*.8} ${h*.58} Z" fill="url(#${g}m)"/>
  <ellipse cx="${w/2}" cy="${h*.58}" rx="${w*.38}" ry="${h*.06}" fill="#3a2410" opacity=".55"/>
  <path d="M${w*.12} ${h*.58} Q${w/2} ${h*.5} ${w*.88} ${h*.58} Q${w*.5} ${h*.66} ${w*.12} ${h*.58}Z" fill="#6f4420"/>
  <path d="M${w*.2} ${h*.6} C${w*.26} ${h*.28} ${w*.4} ${h*.2} ${w*.5} ${h*.2} C${w*.6} ${h*.2} ${w*.74} ${h*.28} ${w*.8} ${h*.6} Q${w/2} ${h*.67} ${w*.2} ${h*.6}Z" fill="${tone}"/>
  <path d="M${w*.2} ${h*.6} C${w*.26} ${h*.28} ${w*.4} ${h*.2} ${w*.5} ${h*.2} C${w*.6} ${h*.2} ${w*.74} ${h*.28} ${w*.8} ${h*.6} Q${w/2} ${h*.67} ${w*.2} ${h*.6}Z" fill="url(#${g}m)"/>
  ${specks}${extra!=='jaggery'?ex:''}
  <defs><radialGradient id="${g}v" cx=".5" cy=".52" r=".78"><stop offset=".5" stop-color="#140a03" stop-opacity="0"/><stop offset="1" stop-color="#140a03" stop-opacity=".62"/></radialGradient>
  <radialGradient id="${g}l" cx=".28" cy=".12" r=".7"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".34"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient></defs>
  <rect width="${w}" height="${h}" fill="url(#${g}l)"/><rect width="${w}" height="${h}" fill="url(#${g}v)"/>
  </svg>`;
}
function grainsBig(seed){ // overhead bowls of mixed grains
  const r=rng(seed), cols=['#c9923f','#7a4a1e','#e0c27d','#4b6b2a','#a2542a','#f0dcae','#3a2a18'];
  let d='';for(let i=0;i<260;i++){const x=r()*300,y=r()*160;d+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(3+r()*3).toFixed(1)}" ry="${(1.8+r()*1.5).toFixed(1)}" transform="rotate(${(r()*180)|0} ${x.toFixed(0)} ${y.toFixed(0)})" fill="${cols[(r()*cols.length)|0]}"/>`;}
  return `<svg viewBox="0 0 300 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="160" fill="#6a4524"/>${d}<ellipse cx="60" cy="40" rx="44" ry="30" fill="#000" opacity=".12"/><ellipse cx="240" cy="120" rx="52" ry="34" fill="#000" opacity=".12"/></svg>`;
}

  if(kind==='drink') return base(`<rect x="38" y="22" width="44" height="70" rx="8" fill="#fbf3e6"/><rect x="38" y="40" width="44" height="52" rx="6" fill="#e7cfa6"/><ellipse cx="60" cy="22" rx="22" ry="5" fill="#fffaf0"/><rect x="42" y="28" width="6" height="56" rx="3" fill="#fff" opacity=".4"/><ellipse cx="60" cy="98" rx="38" ry="6" fill="#000" opacity=".2"/><circle cx="96" cy="86" r="8" fill="#d6a762"/>`,'#a77a48');
  if(kind==='bowl') return base(`<ellipse cx="60" cy="68" rx="46" ry="30" fill="#7a4a22"/><ellipse cx="60" cy="62" rx="40" ry="24" fill="#f2e2c0"/><circle cx="48" cy="58" r="8" fill="#f0c860"/><circle cx="64" cy="54" r="8" fill="#f6d77c"/><circle cx="74" cy="64" r="6" fill="#e0a04a"/><circle cx="52" cy="70" r="5" fill="#8a5a2c"/><circle cx="80" cy="56" r="4" fill="#b8793a"/>`,'#c5a06a');
  return base(`<ellipse cx="60" cy="92" rx="48" ry="8" fill="#000" opacity=".2"/><circle cx="40" cy="66" r="22" fill="#d6a05a"/><circle cx="76" cy="62" r="24" fill="#c98f46"/><circle cx="58" cy="44" r="20" fill="#dcab63"/><g fill="#8a5a2a" opacity=".6"><circle cx="34" cy="60" r="1.800"/><circle cx="48" cy="72" r="1.800"/><circle cx="70" cy="56" r="1.800"/><circle cx="84" cy="68" r="1.800"/><circle cx="54" cy="40" r="1.800"/></g>`,'#b78a55');
}
function temple(){
  const tiers=[...Array(9)].map((_,i)=>`<path d="M${150-62+i*4} ${150-i*11} h${124-i*8} l-3 -9 h-${118-i*8}z" fill="${i%2?'#7d4a2a':'#6a3b20'}"/>`).join('');
  return `<svg viewBox="0 0 300 180" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c58a"/><stop offset=".6" stop-color="#f8a56b"/><stop offset="1" stop-color="#d9714a"/></linearGradient></defs>
  <rect width="300" height="180" fill="url(#sk)"/><circle cx="215" cy="70" r="26" fill="#fff0c9" opacity=".85"/>
  <g transform="translate(70 0)">${tiers}<path d="M150 55 q-14 -22 0 -40 q14 18 0 40z" fill="#5c3018"/><rect x="132" y="120" width="36" height="30" fill="#4d2812"/><path d="M138 150v-16a12 12 0 0 1 24 0v16z" fill="#f4b76f" opacity=".55"/></g>
  <g fill="#3d5b2a"><path d="M20 180 Q22 120 28 80" stroke="#4a3320" stroke-width="4" fill="none"/><path d="M28 80 q-22 -2 -30 14 M28 80 q22 -6 36 6 M28 80 q-12 -18 -2 -26 M28 80 q16 -14 30 -8"/><path d="M280 180 Q276 130 270 96" stroke="#4a3320" stroke-width="4" fill="none"/><path d="M270 96 q-20 -2 -28 12 M270 96 q20 -4 30 8 M270 96 q-10 -16 0 -22"/></g>
  <rect y="150" width="300" height="30" fill="#6f7a3a" opacity=".8"/></svg>`;
}
const sprig=`<svg class="sprig" viewBox="0 0 30 16" fill="#3a8a3f"><path d="M15 15C15 9 14 5 10 2c-1 4 1 8 5 13zM15 15c0-5 2-9 6-12 0 4-2 8-6 12zM15 15C9 12 5 11 1 11c3 3 8 5 14 4zM15 15c6-3 10-4 14-4-3 3-8 5-14 4z" opacity=".9"/></svg>`;
const logo=`<div class="logo">${sprig}<b>CHATUA</b><small>Odisha's Traditional Food</small></div>`;

/* ---------- views ---------- */
const topbar = (over) => `<div class="topbar${over?' over':''}"><button aria-label="Home" data-a="go" data-s="home" style="text-align:left">${logo}</button>
 <div class="icons"><button class="ib" aria-label="Search" data-a="go" data-s="shop" data-focus="1">${I.search}</button>
 <button class="ib" aria-label="Cart" data-a="go" data-s="cart">${I.cart}${cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button></div></div>`;
const backbar = (title,extra='') => `<div class="backbar"><button class="ib" aria-label="Back" data-a="back">${I.back}</button><h2>${title}</h2>${extra}</div>`;

function productCard(p){
  const sz=sizeOf(p.id);
  return `<div class="pc"><button data-a="go" data-s="product" data-id="${p.id}" style="display:block;width:100%;text-align:left">
   <div class="im">${mound(p.tone,p.extra,p.id.length*7+3)}</div></button>
   <div class="b"><h4>${p.name}</h4><small>${sz}</small><div class="pr">${inr(p.price[sz])}</div>
   <button class="plus" aria-label="Add ${p.name} to cart" data-a="add" data-id="${p.id}">${I.plus}</button></div></div>`;
}
const trustRow = (items,cls='') => `<div class="trust ${cls}">${items.map(([i,t])=>`<div><span class="c">${i}</span>${t}</div>`).join('')}</div>`;

function vHome(){
  return `${topbar(true)}
  <div class="hero"><div class="art">${mound('#dcbc8c',null,11,300,300)}</div>
   <div class="txt"><h1>The Goodness of Grains, In Every Spoon.</h1><p>A traditional Odisha food, made from natural grains for everyday nourishment.</p>
   <button class="btn" data-a="go" data-s="shop">Shop Chatua ${I.arrow}</button></div></div>
  <div class="sheet">
   ${trustRow([[I.leaf,'100%<br>Natural'],[I.nutri,'Rich in<br>Nutrition'],[I.nopres,'No Added<br>Preservatives'],[I.truck,'Pan India<br>Delivery']])}
   <button class="heritage-card" data-a="go" data-s="heritage"><svg class="bg">${''}</svg>${temple().replace('<svg ','<svg class="bg" ')}
    <div class="t"><h3>Chatua from Odisha</h3><p>A traditional food with a rich heritage.</p><span class="link">Learn More →</span></div></button>
   <div class="sec-h"><h3>Shop Our Chatua</h3><button class="link" data-a="go" data-s="shop">View All →</button></div>
   <div class="grid2">${PRODUCTS.slice(0,2).map(productCard).join('')}</div>
   <div class="sec-h"><h3>New to Chatua?</h3></div>
   <button class="rrow" data-a="go" data-s="about" style="margin-bottom:18px"><div class="im">${grainsBig(5)}</div><div><b>What is Chatua?</b><small>A quick guide to this Odisha grain powder and how to enjoy it.</small></div></button>
  </div>`;
}

function vShop(){
  const q=S.q.trim().toLowerCase();
  const items=PRODUCTS.filter(p=>(S.cat==='All'||p.cat===S.cat)&&(!q||(p.name+' '+p.desc).toLowerCase().includes(q)));
  return `${topbar()}
  <div class="search">${I.search}<input id="q" type="search" placeholder="Search Chatua…" value="${S.q.replace(/"/g,'&quot;')}" aria-label="Search Chatua"></div>
  <div class="chips">${CATS.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="list" id="plist">${plist(items)}</div>`;
}
function plist(items){
  if(!items.length) return `<div class="empty">${I.search}<h3>No Chatua found</h3><p>Try a different name, or see all our blends.</p><button class="btn sm" data-a="clear">Show all Chatua</button></div>`;
  return items.map(p=>{const sz=sizeOf(p.id);return `<div class="row">
   <button class="im" aria-label="${p.name}" data-a="go" data-s="product" data-id="${p.id}">${mound(p.tone,p.extra,p.id.length*7+3)}</button>
   <div class="b"><button data-a="go" data-s="product" data-id="${p.id}" style="text-align:left"><h4>${p.name}</h4><p>${p.desc}</p></button>
   <div class="sizes">${['500g','1kg'].map(s=>`<button class="sz ${sz===s?'on':''}" data-a="size" data-id="${p.id}" data-z="${s}">${s}</button>`).join('')}</div>
   <div class="pr">${inr(p.price[sz])}</div></div>
   <button class="plus" style="right:12px;bottom:12px;width:38px;height:38px" aria-label="Add ${p.name} to cart" data-a="add" data-id="${p.id}">${I.plus}</button></div>`}).join('');
}

function vProduct(){
  const p=P(S.params.id), sz=sizeOf(p.id), qty=S.params.qty||1;
  return `<div class="pgal"><button class="float" style="left:14px" aria-label="Back" data-a="back">${I.back}</button>
   <div style="position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:4"><button class="float" style="position:static" aria-label="Save" data-a="fav">${I.heart.replace('<svg ','<svg width="20" height="20" ')}</button><button class="float" style="position:static" aria-label="Share" data-a="share">${I.share}</button></div>
   <div class="snap" id="snap">${[0,1,2].map(i=>`<div>${mound(p.tone,p.extra,p.id.length*7+3+i*5)}</div>`).join('')}</div>
   ${p.best?'<span class="tag">Bestseller</span>':''}<div class="dots" id="dots"><i class="on"></i><i></i><i></i></div></div>
  <div class="sheet" style="margin-top:-22px"><div class="pbody" style="padding:6px 2px 24px">
   <h1>${p.name}</h1><p class="sub">${p.desc}</p>
   ${trustRow([[I.leaf,'100%<br>Natural'],[I.nutri,'Rich in<br>Nutrition'],[I.nopres,'No Added<br>Preservatives']],'three')}
   <h3 class="h3" style="margin:6px 0 0;font-size:16px">Choose Size</h3>
   <div class="opts">${['500g','1kg'].map(s=>`<button class="opt ${sz===s?'on':''}" data-a="psize" data-z="${s}"><b>${s}</b><span>${inr(p.price[s])}</span></button>`).join('')}</div>
   <div class="qty"><button class="qb" aria-label="Decrease" data-a="pq" data-d="-1">${I.minus}</button><b>${qty}</b><button class="qb" aria-label="Increase" data-a="pq" data-d="1">${I.plus}</button></div>
   <button class="btn block" data-a="padd">Add to Cart &nbsp;|&nbsp; ${inr(p.price[sz]*qty)}</button>
   ${trustRow([[I.truck,'Pan India<br>Delivery'],[I.lock,'Secure<br>Payment'],[I.ret,'Easy<br>Returns']],'three').replace('class="trust three"','class="trust three" style="margin-top:14px"')}
   <details open><summary>Product Details ${I.chev}</summary><p>${p.long}</p></details>
   <details><summary>How to enjoy ${I.chev}</summary><p>Mix 2 to 3 tablespoons in a glass of cold water, milk or buttermilk. Stir well and drink fresh. You can also add it to breakfast bowls or make ladoos.</p></details>
   <details><summary>Storage ${I.chev}</summary><p>Keep in an airtight container in a cool, dry place and use a dry spoon each time.</p></details>
  </div></div>`;
}

function vCart(){
  if(!S.cart.length) return backbar('Your Cart')+`<div class="empty">${I.cart.replace(/width="22" height="22"/,'width="46" height="46"')}<h3>Your cart is empty</h3><p>Add a pack of Chatua to get started.</p><button class="btn" data-a="go" data-s="shop">Shop Chatua</button></div>`;
  const ids=S.cart.map(i=>i.id), more=PRODUCTS.filter(p=>!ids.includes(p.id));
  const need=FEES.freeAbove-subtotal();
  return backbar('Your Cart')+
  S.cart.map((it,idx)=>{const p=P(it.id);return `<div class="ci"><div class="im">${mound(p.tone,p.extra,p.id.length*7+3)}</div>
   <div class="b"><div><h4>${p.name}</h4><small>${it.size}</small></div><div class="l"><span class="pr">${inr(p.price[it.size]*it.qty)}</span>
   <span class="mini"><button aria-label="Decrease" data-a="cq" data-i="${idx}" data-d="-1">${I.minus}</button><b>${it.qty}</b><button aria-label="Increase" data-a="cq" data-i="${idx}" data-d="1">${I.plus}</button></span></div></div>
   <button class="trash" aria-label="Remove ${p.name}" data-a="rm" data-i="${idx}">${I.trash}</button></div>`}).join('')+
  (need>0&&S.delivery==='standard'?`<p style="margin:2px 18px 4px;font-size:12.5px;color:var(--muted)">Add ${inr(need)} more for free standard delivery.</p>`:`<p style="margin:2px 18px 4px;font-size:12.5px;color:var(--leaf);font-weight:700">You get free standard delivery.</p>`)+
  (more.length?`<div class="sec-h" style="margin:16px 16px 12px"><h3 style="font-family:var(--head);font-size:18px">Add more to your cart</h3><button class="link" data-a="go" data-s="shop">View All →</button></div><div class="scroll-cards">${more.map(productCard).join('')}</div>`:'')+
  `<h3 class="h3">Order Summary</h3><div class="card sum"><div><span>${cartCount()} item${cartCount()>1?'s':''}</span><span>${inr(subtotal())}</span></div><div><span>Delivery</span><span>${delFee()?inr(delFee()):'Free'}</span></div><div class="tot"><span style="font-size:15px;font-family:var(--body)">Total</span><span>${inr(subtotal()+delFee())}</span></div></div><div style="height:16px"></div>`;
}
const cartFoot=()=>`<div class="stick"><button class="btn block" data-a="go" data-s="checkout">Proceed to Checkout ${I.arrow}</button></div>`;

function vCheckout(){
  const a=S.addr,b=S.bad, total=subtotal()+delFee();
  const fld=(k,ph,type='text',extra='')=>`<input data-f="${k}" class="${b[k]?'bad':''}" placeholder="${ph}" value="${(a[k]||'').replace(/"/g,'&quot;')}" type="${type}" ${extra} aria-label="${ph}">`;
  const del=(id,t,d,pr)=>`<button class="rad ${S.delivery===id?'on':''}" data-a="del" data-v="${id}"><span class="dot"></span><span class="t"><b>${t}</b><small>${d}</small></span><span style="font-weight:700;font-size:14px">${pr}</span></button>`;
  const pay=(id,t,ico)=>`<button class="rad ${S.pay===id?'on':''}" data-a="pay" data-v="${id}">${ico}<span class="t">${t}</span><span class="dot"></span></button>`;
  return backbar('Delivery Details')+
  `<div class="seg" role="tablist">${['Home','Work'].map(t=>`<button class="${a.type===t?'on':''}" data-a="atype" data-v="${t}">${t==='Home'?I.home.replace(/22/g,'18'):I.work}${t}</button>`).join('')}</div>
  <div class="card fld">${fld('name','Full name','text','autocomplete="name"')}${fld('phone','Mobile number','tel','inputmode="numeric" maxlength="10" autocomplete="tel"')}${fld('line','House no., street, area','text','autocomplete="street-address"')}<div class="two">${fld('city','City','text')}${fld('pin','Pincode','text','inputmode="numeric" maxlength="6"')}</div></div>
  ${S.err?`<p class="err" role="alert">${S.err}</p>`:''}
  <h3 class="h3">Delivery Options</h3><div class="pay-wrap">
  ${del('standard','Standard Delivery','3 – 5 days',subtotal()>=FEES.freeAbove?'<em style="font-style:normal;color:var(--leaf)">Free</em>':inr(FEES.standard)+'')}
  ${del('express','Express Delivery','2 – 3 days',inr(FEES.express))}</div>
  <h3 class="h3">Payment Method</h3><div class="pay-wrap">
  ${pay('upi','UPI (Google Pay, PhonePe, etc.)',I.upi)}${pay('card','Credit / Debit Card',I.card)}${pay('net','Net Banking',I.bank)}${pay('cod','Cash on Delivery (COD)',I.cash)}</div>
  <div class="card sum" style="margin-top:6px"><div><span>Items</span><span>${inr(subtotal())}</span></div><div><span>Delivery</span><span>${delFee()?inr(delFee()):'Free'}</span></div><div class="tot"><span style="font-size:15px;font-family:var(--body)">Total</span><span>${inr(total)}</span></div></div><div style="height:16px"></div>`;
}
const payFoot=()=>`<div class="stick"><button class="btn block" data-a="place">Pay ${inr(subtotal()+delFee())} ${I.arrow}</button><p style="text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px">${S.pay==='cod'?'Pay in cash when your order arrives':'100% Secure Payment'}</p></div>`;

function vSuccess(){
  const o=S.order; if(!o) return vHome();
  const cols=['#e8662b','#f2b134','#2f8f4e','#3b82c4'];
  const conf=[...Array(16)].map((_,i)=>`<i style="left:${6+i*6}%;top:${10+(i*13)%30}px;background:${cols[i%4]};animation-delay:${(i%6)*.12}s"></i>`).join('');
  return `<div class="success"><div class="conf">${conf}</div><div class="tick">${I.check.replace('currentColor','#fff')}</div>
  <h1>Order Placed<br>Successfully!</h1><p>Thank you for choosing Chatua.<br>Your order has been confirmed.</p>
  <div class="card oid"><div class="r"><div><small>Order ID</small><b>${o.id}</b></div><button class="ib" aria-label="Copy order ID" data-a="copyid">${I.copy}</button></div>
  <div class="r" style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px"><div><small>Estimated Delivery</small><b>${o.eta}</b></div><b style="font-family:var(--head);font-size:18px">${inr(o.total)}</b></div></div>
  <button class="btn line block" style="background:transparent" data-a="track">Track Order ${I.arrow}</button></div>
  ${S.params.track?`<div class="tl"><h3 class="h3" style="margin:6px 0 12px">Order status</h3>${[['Order confirmed','Just now',1],['Packed fresh in Odisha','Within 24 hours',0],['Out for delivery',o.eta,0],['Delivered','',0]].map(([t,s,d])=>`<div class="s ${d?'d':''}"><i class="p"></i><div><b>${t}</b><br><span>${s}</span></div></div>`).join('')}</div>`:''}
  <h3 class="h3" style="margin-top:6px">You might also like</h3><div class="scroll-cards" style="padding-bottom:20px">${PRODUCTS.filter(p=>!o.ids.includes(p.id)).slice(0,2).map(productCard).join('')}</div>`;
}

function vAbout(){
  return backbar('What is Chatua?')+`<div class="photo" style="height:160px">${grainsBig(9)}</div><div class="copy">
  <h2>A traditional food from Odisha, made with natural grains.</h2>
  <p>Chatua is a traditional food from Odisha, prepared by carefully selecting grains and pulses, traditionally roasted and finely ground into a wholesome powder.</p>
  <p>It has been part of Odisha's food culture for generations and is known for its simplicity, natural ingredients and versatility.</p>
  <p>Similar to sattu in its powdered form, Chatua can be enjoyed in many ways: as a drink, breakfast, snack or part of traditional recipes.</p>
  <button class="btn" data-a="go" data-s="recipes">See recipes ${I.arrow}</button></div>`;
}
function vHeritage(){
  return backbar('Our Odisha Heritage')+`<div class="photo" style="height:190px">${temple()}</div><div class="copy">
  <h2>A Traditional Food with a Rich Heritage</h2>
  <p>Chatua has deep roots in Odisha's food culture. Made with traditional ingredients and simple preparation, it has been enjoyed by generations for its natural goodness and wholesome nutrition.</p></div>
  ${trustRow([[I.temple,"Odisha's<br>Traditional Food"],[I.leaf,'Generations<br>of Trust'],[I.nutri,'Natural<br>Goodness']],'three')}
  <div style="padding:0 16px 24px"><button class="btn block" data-a="go" data-s="shop">Shop Chatua</button></div>`;
}
function vRecipes(){
  const c=['All','Drinks','Breakfast','Snacks'];
  const items=RECIPES.filter(r=>S.rcat==='All'||r.cat===S.rcat);
  return backbar('Recipes')+`<div class="chips">${c.map(x=>`<button class="chip ${S.rcat===x?'on':''}" data-a="rcat" data-c="${x}">${x}</button>`).join('')}</div>
  <div class="list">${items.map((r,i)=>`<details class="rrow" style="display:block;margin:0;border-top:1px solid var(--line)"><summary style="display:flex;gap:12px;align-items:center;font-weight:400"><div class="im">${food(r.kind)}</div><div style="flex:1"><b>${r.name}</b><small>${r.note}</small></div>${I.chev}</summary><p style="padding:10px 6px 4px">${r.body}</p></details>`).join('')}</div>`;
}
function vAccount(){
  const m=[['about','What is Chatua?',I.info],['heritage','Our Odisha Heritage',I.temple],['recipes','Recipes',I.book],['cart','My Cart',I.cart]];
  return `<div class="backbar" style="padding-left:20px"><h2>Account</h2></div>
  <div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div class="ib" style="background:var(--clay-soft);color:var(--clay);width:52px;height:52px">${I.user}</div><div><b>Welcome to Chatua</b><div style="font-size:13px;color:var(--muted);margin-top:2px">Sign in to track orders and save addresses. Coming soon.</div></div></div>
  <div class="menu">${m.map(([s,t,i])=>`<button data-a="go" data-s="${s}">${i}${t}${I.right}</button>`).join('')}</div>`;
}

/* ---------- render ---------- */
const MAIN=['home','shop','recipes','cart','account'];
function nav(){
  const cur=S.screen==='product'||S.screen==='checkout'?null:S.screen;
  const t=[['home','Home',I.home],['shop','Shop',I.shop],['recipes','Recipes',I.book],['cart','Cart',I.cart],['account','Account',I.user]];
  return `<nav aria-label="Main">${t.map(([s,l,i])=>`<button class="${cur===s?'on':''}" data-a="go" data-s="${s}" data-root="1">${i}${l}${s==='cart'&&cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button>`).join('')}</nav>`;
}
function render(keepScroll){
  const v=document.getElementById('view'), top=v.scrollTop;
  const M={home:vHome,shop:vShop,product:vProduct,cart:vCart,checkout:vCheckout,success:vSuccess,about:vAbout,heritage:vHeritage,recipes:vRecipes,account:vAccount};
  v.innerHTML=M[S.screen]();
  let foot='';
  if(S.screen==='cart'&&S.cart.length) foot=cartFoot()+nav();
  else if(S.screen==='checkout') foot=payFoot();
  else if(S.screen==='product'||S.screen==='about'||S.screen==='heritage') foot='';
  else foot=nav();
  document.getElementById('navwrap').innerHTML=foot;
  v.scrollTop=keepScroll?top:0;
  if(S.screen==='product'){
    const sn=document.getElementById('snap'),ds=document.querySelectorAll('#dots i');
    sn.addEventListener('scroll',()=>{const i=Math.round(sn.scrollLeft/sn.clientWidth);ds.forEach((d,j)=>d.classList.toggle('on',i===j));},{passive:true});
  }
}
function go(s,params={},root){
  if(root||MAIN.includes(s)&&['home','shop','recipes','cart','account'].includes(s)&&root) S.stack=[];
  else S.stack.push({screen:S.screen,params:S.params});
  S.screen=s;S.params=params;S.err='';render();
}
function back(){const p=S.stack.pop();if(p){S.screen=p.screen;S.params=p.params}else{S.screen='home';S.params={}}render();}
let tt;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1700);}
function addToCart(id,size,qty=1){
  const f=S.cart.find(i=>i.id===id&&i.size===size);
  if(f) f.qty+=qty; else S.cart.push({id,size,qty});
  saveCart();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a,d=t.dataset;
  switch(a){
   case 'go': go(d.s,d.id?{id:d.id}:{},!!d.root); if(d.focus) setTimeout(()=>{const q=document.getElementById('q');q&&q.focus()},60); break;
   case 'back': back(); break;
   case 'cat': S.cat=d.c; render(true); break;
   case 'clear': S.cat='All';S.q=''; render(); break;
   case 'rcat': S.rcat=d.c; render(true); break;
   case 'size': S.sel[d.id]=d.z; render(true); break;
   case 'add': {const p=P(d.id);addToCart(d.id,sizeOf(d.id));render(true);toast(`${p.name} added to cart`);break;}
   case 'psize': S.sel[S.params.id]=d.z; render(true); break;
   case 'pq': S.params.qty=Math.max(1,Math.min(20,(S.params.qty||1)+Number(d.d))); render(true); break;
   case 'padd': {const p=P(S.params.id);addToCart(p.id,sizeOf(p.id),S.params.qty||1);S.params.qty=1;render(true);toast(`${p.name} added to cart`);break;}
   case 'fav': t.style.color=t.style.color?'':'#ff8a6a'; toast('Saved to favourites'); break;
   case 'share': if(navigator.share){navigator.share({title:'Chatua',text:'Chatua – Odisha\'s Traditional Food'}).catch(()=>{})}else toast('Link copied'); break;
   case 'cq': {const it=S.cart[+d.i];it.qty+=Number(d.d);if(it.qty<1)S.cart.splice(+d.i,1);saveCart();render(true);break;}
   case 'rm': S.cart.splice(+d.i,1);saveCart();render(true);break;
   case 'atype': S.addr.type=d.v; render(true); break;
   case 'del': S.delivery=d.v; render(true); break;
   case 'pay': S.pay=d.v; render(true); break;
   case 'place': placeOrder(); break;
   case 'copyid': try{navigator.clipboard.writeText(S.order.id)}catch(e){} toast('Order ID copied'); break;
   case 'track': S.params.track=!S.params.track; render(true); if(S.params.track) setTimeout(()=>document.querySelector('.tl')?.scrollIntoView({behavior:'smooth',block:'center'}),50); break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;document.getElementById('plist').innerHTML=plist(PRODUCTS.filter(p=>{const q=S.q.trim().toLowerCase();return (S.cat==='All'||p.cat===S.cat)&&(!q||(p.name+' '+p.desc).toLowerCase().includes(q))}));}
  if(t.dataset.f){S.addr[t.dataset.f]=t.value;t.classList.remove('bad');}
});
function placeOrder(){
  const a=S.addr;S.bad={};
  if(!a.name.trim())S.bad.name=1; if(!/^\d{10}$/.test(a.phone.trim()))S.bad.phone=1;
  if(!a.line.trim())S.bad.line=1; if(!(a.city||'').trim())S.bad.city=1; if(!/^\d{6}$/.test(a.pin.trim()))S.bad.pin=1;
  if(Object.keys(S.bad).length){S.err='Please complete the highlighted fields. Mobile needs 10 digits and pincode needs 6 digits.';render(true);document.getElementById('view').scrollTo({top:0,behavior:'smooth'});return;}
  S.err='';
  S.order={id:'#CHATUA'+Math.floor(10000+Math.random()*89999),eta:S.delivery==='express'?'2 – 3 days':'3 – 5 days',total:subtotal()+delFee(),ids:S.cart.map(i=>i.id)};
  S.cart=[];saveCart();S.stack=[];S.screen='success';S.params={};render();
}
render();
</script>
</body>
</html>
